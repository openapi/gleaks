app-id: io.github.openapi.GLeaks
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: gleaks

finish-args:
  # Only used for checks the user has confirmed.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # No filesystem access: profiles are chosen through Gtk.FileDialog, which goes
  # through the document portal. libsecret uses the Secret portal on its own.

modules:
  # Pre-built wheels, one per interpreter and architecture; pip installs the match.
  - name: python3-cryptography
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --no-build-isolation --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} pycparser cffi cryptography
    sources:
